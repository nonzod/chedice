services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: chedice-llama
    command:
      - -hf
      - Qwen/Qwen3-VL-2B-Instruct-GGUF:Q4_K_M
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "16384"
      - --reasoning
      - "off"
      - --repeat-penalty
      - "1.12"
      - -ngl
      - "99"
    volumes:
      - llama-models:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: no

  app:
    build: .
    container_name: chedice
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - model-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: no
    depends_on:
      - llama

volumes:
  model-cache:
  llama-models:
